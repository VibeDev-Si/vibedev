# VibeDev product defaults, the last layer of every dsh-base profile (Desktop and
# Web, headless, ACP, SDK). A patch replaces a row's whole config, so an
# overridden row restates every key it keeps.

# Nothing goes to DeepSeek's servers by default: model requests carry no
# session-log or plugin-inventory extensions, and feedback does not upload the
# session to DeepSeek's telemetry collector.
- id: session-log-deepseek
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- id: session-telemetry-otel
  disabled: true

# The model is told it runs in VibeDev, not DeepSeek Harness.
- id: system-prompt
  config:
    includeHarnessIdentity: false
    personaPrefix: 'You are an AI agent running in VibeDev.'

# Sign-in is a VibeDev account on our gateway (authorization code + PKCE, app
# tokens), not a DeepSeek account. The DeepSeek account models go with it: their
# requests need a DeepSeek account token, which the VibeDev account never hands
# out for a non-gateway address.
- id: deepseek-account
  disabled: true

- id: llm-deepseek-account
  disabled: true

# New sessions start on a gateway model rather than the DeepSeek API-key route,
# which needs a key nobody has configured. Interim choice: the cheap, fast,
# vision-capable DeepSeek V4 Flash on the gateway.
- id: agent-default-model
  config:
    provider: deepseek-account
    model: deepseek-v4-flash

- insert:
    - id: vibedev-account
      name: '@vibedev/dsh-account'
      config:
        desktopPlatform: !!js "ctx.get('profileContext')?.name === 'desktop' && ['darwin', 'win32'].includes(process.platform) ? process.platform : null"
    # The gateway's models take the account channel the DeepSeek account models
    # left, so pickers list them first and the sign-in and top-up prompts apply.
    - id: llm-vibedev-gateway
      name: '@vibedev/dsh-llm-gateway'
