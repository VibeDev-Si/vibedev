# VibeDev product defaults, the last layer of every dsh-base profile (Desktop and
# Web, headless, ACP, SDK). A patch replaces a row's whole config, so an
# overridden row restates every key it keeps.

# Nothing goes to DeepSeek's servers by default: model requests carry no
# session-log or plugin-inventory extensions, and feedback does not upload the
# session to DeepSeek's telemetry collector.
- id: session-log-deepseek
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- id: session-telemetry-otel
  disabled: true

# The model is told it runs in VibeDev, not DeepSeek Harness.
- id: system-prompt
  config:
    includeHarnessIdentity: false
    personaPrefix: 'You are an AI agent running in VibeDev.'

# Two accounts (user decision, 2026-10-06). The VibeDev account is the main one
# and comes from the @vibedev-si/dsh-vibedev plugin inserted below: its own
# sign-in on our gateway, the gateway's models on the `vibedev-gateway` route,
# web search and media generation. The DeepSeek account rows (`deepseek-account`,
# `llm-deepseek-account`) stay exactly as DeepSeek Harness ships them, as the
# second account: its sign-in and tokens stay between the app and DeepSeek, and
# its token is only ever sent to DeepSeek's own API.

# The DeepSeek API-key route stays off (user decision, 2026-10-03): without a key
# it still listed models in the picker and a "DeepSeek" row on the Models page,
# and every request failed. Users who want their own provider add it on the
# Models page instead.
- id: llm-deepseek
  disabled: true

# New sessions start on a VibeDev model: the cheap, fast, vision-capable
# DeepSeek V4 Flash on the gateway. Signed out of VibeDev, a request asks for
# the VibeDev sign-in.
- id: agent-default-model
  config:
    provider: vibedev-gateway
    model: deepseek-v4-flash

# Web search goes through the gateway with the VibeDev sign-in (the plugin's
# `vibedev-gateway` provider), like the models. The DeepSeek provider would need
# a DeepSeek key or a DeepSeek account model; turning it off also removes its
# settings page (a DeepSeek key). Fetching stays on the local HTTP provider.
- id: web-search-deepseek
  disabled: true

- id: web
  config:
    searchProvider: vibedev-gateway
    fetchProvider: http

- insert:
    # The VibeDev account as the app's main account: the bottom row of the
    # sidebar and the first Settings sections, its models first in the pickers.
    # It signs in as the plugin client (`vibedev-plugin`, proven on the gateway
    # with the plugin's loopback callback); `client` names another one once the
    # gateway accepts it there.
    - id: dsh-vibedev
      name: '@vibedev-si/dsh-vibedev'
      config:
        primary: true
        gatewayOrigin: https://vibedev.jzsaas.com
        apiKeyEnv: ''
