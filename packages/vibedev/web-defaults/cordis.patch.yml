# VibeDev defaults for the Web and Desktop composition, layered after
# dsh-web-app. A patch replaces a row's whole config, so an overridden row
# restates every key it keeps.

# Desktop turns product analytics on by default and sends it to DeepSeek's
# collector; VibeDev sends none.
- id: desktop-product-telemetry
  disabled: true

- id: product-analytics
  disabled: true

# The Settings toggle for uploading session logs to help improve DeepSeek's
# models; the upload itself is off in @vibedev/dsh-defaults.
- id: ui-settings-session-log
  disabled: true

# The DeepSeek whale and wordmark never show; the VibeDev glyph and name take
# the sidebar and blank-session hero brand slots instead.
- id: ui-brand-official
  disabled: true

- insert:
    - id: vibedev-brand
      name: '@vibedev/dsh-client-brand'

# `vibedev-app web` listens on 3180 by default so it never collides with an
# installed DeepSeek Harness on 3080; `--port` and the Desktop Host still win.
- id: webserver
  config:
    host: !!js ctx.webStartup.host ?? '127.0.0.1'
    port: !!js ctx.webStartup.port ?? 3180
    compression: gzip
    compressionLevel: 1
    compressionThresholdBytes: 1024

# The web layer's persona, restated: a patch replaces the whole config, and
# @vibedev/dsh-defaults (applied before this layer) would otherwise leave the
# web/desktop model without its {{model}} line and working directory. The
# suffix also tells the model how plugins are installed in VibeDev, because
# plugin READMEs give the DeepSeek Harness command, and a `dsh` on PATH belongs
# to that separate app.
- id: system-prompt
  config:
    includeHarnessIdentity: false
    personaPrefix: >-
      You are a coding agent running in VibeDev, powered by the {{model}} model.
    personaSuffix: |-
      Your working directory is {{cwd}}.

      Plugins in VibeDev are installed, enabled, and removed on the Plugins page (Plugins → Add plugin), which installs into the profile this app runs. When the user asks to install a plugin, send them there with the package name. The command-line equivalent, when `vibedev-app` is on PATH, is `vibedev-app plugin --profile desktop add <package>` for the desktop app, which must be fully quit first. Plugin READMEs written for DeepSeek Harness say `dsh plugin --profile web add <package>`: never run that for VibeDev. A `dsh` command on PATH belongs to the separate DeepSeek Harness app, and a `web` profile is not the one the VibeDev desktop app loads.
